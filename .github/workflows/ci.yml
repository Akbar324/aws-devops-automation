name: DevOps CI/CD

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform Version
        run: terraform version

      - name: Initialize Terraform
        working-directory: ./terraform
        run: terraform init -backend=false

      - name: Validate Terraform
        working-directory: ./terraform
        run: terraform validate

      - name: Install Ansible
        run: pip install ansible

      - name: Check Ansible Version
        run: ansible --version

      - name: Check Docker Collection
        run: ansible-galaxy collection list community.docker

      - name: Validate Ansible Playbooks
        working-directory: ./ansible
        run: ansible-playbook -i localhost, deploy.yml --syntax-check

  deploy:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug OIDC Identity
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch reference: $GITHUB_REF"

          curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | python3 -c "import sys,json,base64; p=json.load(sys.stdin)['value'].split('.')[1]; d=json.loads(base64.urlsafe_b64decode(p+'='*(-len(p)%4))); print(json.dumps({k:d.get(k) for k in ['iss','aud','sub']},indent=2))"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          retry-max-attempts: 2

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Deploy Website
        run: bash scripts/deploy-website.sh
