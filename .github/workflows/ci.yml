name: DevOps CI/CD

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform Version
        run: terraform version

      - name: Initialize Terraform
        working-directory: ./terraform
        run: terraform init -backend=false

      - name: Validate Terraform
        working-directory: ./terraform
        run: terraform validate

      - name: Install Ansible
        run: pip install ansible

      - name: Check Ansible Version
        run: ansible --version

      - name: Check Docker Collection
        run: ansible-galaxy collection list community.docker

      - name: Validate Ansible Playbooks
        working-directory: ./ansible
        run: ansible-playbook -i localhost, deploy.yml --syntax-check

  deploy:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Deploy Website
        run: bash scripts/deploy-website.sh
